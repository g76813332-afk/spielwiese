const coarse = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;

/* ---------------- Audio ---------------- */
let ac = null, nbuf = null, mus = null;
function audio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  }

function tone(f0, f1, dur, type = 'square', vol = .12, delay = 0) {
  if (!ac) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);

function noise(dur, vol, f0, f1, type = 'lowpass', delay = 0) {
  if (!ac) return; const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = nbuf; f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur + .02);
}
const sfx = {
  hit: s => { noise(.1 + s * .04, .25 + s * .08, 3000, 300); tone(160 - s * 20, 50, .12, 'square', .12); },
  punch: () => noise(.06, .15, 2500, 600), jump: () => tone(300, 600, .1, 'square', .06),
  special: () => { tone(300, 900, .18, 'sawtooth', .08); noise(.15, .1, 4000, 800, 'highpass'); },
  block: () => tone(900, 700, .06, 'triangle', .12), ko: () => { noise(.5, .3, 2000, 100); tone(400, 60, .5, 'sawtooth', .12); },
  boom: () => { noise(.7, .4, 1800, 60); tone(90, 30, .6, 'sine', .3); }, ult: () => { [220, 330, 440, 660].forEach((f, i) => tone(f, f * 1.5, .5, 'sawtooth', .07, i * .06)); },

};
// Kampfmusik: kleiner Sequenzer (Bass + Melodie), Tonart wechselt in Domaenen
const SCALES = { norm: [0, 3, 5, 7, 10], dom: [0, 1, 5, 7, 8] };
function startMusic() {
  stopMusic(); if (!opt.music || !ac) return; let step = 0;
  mus = setInterval(() => {
    if (!ac || state !== 'game' || clipMusic) return; const sc = SCALES[dom.type ? 'dom' : 'norm'], root = dom.type ? 41.2 : 55;
    const f = n => root * Math.pow(2, (sc[n % 5] + 12 * Math.floor(n / 5)) / 12);
    const bass = [0, 0, 2, 0, 3, 3, 1, 2][step % 8];
    tone(f(bass), f(bass), .16, 'triangle', .09);
    if (step % 2 === 0) tone(f([5, 7, 6, 8, 5, 9, 7, 6][(step >> 1) % 8]) * 2, f(5) * 2, .1, 'square', .025);
    if (step % 4 === 2) noise(.04, .05, 6000, 3000, 'highpass');
    step++;
  }, 165);
}
const stopMusic = () => { if (mus) { clearInterval(mus); mus = null; } stopClipMusic(); };
// Original-Aufnahmen (Stimmen und Musik aus Voices.h / Clips.cpp, 16 kHz mu-law)
const CLIPS = {};
function decodeClips() {
  if (!ac || CLIPS._done || typeof AUDIO_B64 === 'undefined') return;
  for (const k in AUDIO_B64) {
    const bin = atob(AUDIO_B64[k]), n = bin.length, buf = ac.createBuffer(1, n, 16000), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { const y = bin.charCodeAt(i) / 255 * 2 - 1, a = (Math.pow(256, Math.abs(y)) - 1) / 255; d[i] = (y < 0 ? -a : a) * .75; }
    CLIPS[k] = buf;
  }
  CLIPS._done = 1;
}
let voiceSrc = null, clipMusic = null;
function playClip(name, loop) {
  if (!ac || !CLIPS[name]) return null; const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = CLIPS[name]; s.loop = !!loop; g.gain.value = loop ? .3 : 1; s.connect(g).connect(ac.destination); s.start(); return s;
}
function playVoice(name) { stopVoice(); voiceSrc = playClip(name); return voiceSrc; }
function stopVoice() { if (voiceSrc) { try { voiceSrc.stop(); } catch (e) {} voiceSrc = null; } }
function startClipMusic(name) { stopClipMusic(); clipMusic = playClip(name, true); }
function stopClipMusic() { if (clipMusic) { try { clipMusic.stop(); } catch (e) {} clipMusic = null; } }
const clipFrames = n => CLIPS[n] ? Math.floor(CLIPS[n].duration * 30) + 1 : 0;
function voiceName(f, k) {
  if (f.ch === CH.VEX && f.winzling) return k === 0 ? 'voiceA' : 'voiceB';
  const n = ['kaito', 'vex', null, 'nox'][f.ch]; return n && CLIPS[n + k] ? n + k : null;
}

/* ---------------- Hilfen ---------------- */
function addParticle(x, y, vx, vy, life, col, type = 0) { if (parts.length < 260) parts.push({ x, y, vx, vy, life, max: life, col, type }); }
function addText(x, y, t, col) { texts.push({ x: clamp(x, 24, W - 24), y: clamp(y, 12, H - 40), life: 28, t, col }); if (texts.length > 12) texts.shift(); }
function shake(t, m) { if (m >= shakeMag || shakeT <= 0) { shakeT = t; shakeMag = m; } }
function starBurst(x, y, n, sp) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = sp * (.5 + Math.random()); addParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, ri(10, 20), Math.random() < .5 ? '#ffe628' : '#fff', Math.random() < .3 ? 1 : 0); } }
const canBeHit = f => !f.out && f.respawnT <= 0 && f.invuln <= 0;
const mainPlat = () => plats[0];

  const w = m.w * CHAR_S, h = m.h * CHAR_S; let dx = m.dx * CHAR_S, ww = w;

  const cx = f.x + f.face * dx, cy = f.y + m.dy * CHAR_S; return [cx - ww / 2, cy - h / 2, cx + ww / 2, cy + h / 2];
}

/* ---------------- Figuren ---------------- */
function resetFighter(f) {
  Object.assign(f, { vx: 0, vy: 0, ground: false, jumps: CHARS[f.ch].jumps, upUsed: false, move: 0, comboQ: false, hitstun: 0, dizzy: 0, dropT: 0,

}
function spawnFighter(f, i) {
  const sx = [108, 212, 160, 78]; f.x = sx[i]; f.y = i === 2 ? plats[3].y : plats[0].y; f.face = f.x < 160 ? 1 : -1;
  resetFighter(f); f.invuln = 0; f.dmg = 0; f.respawnT = 0; f.meter = 0; f.ground = true; f.platform = i === 2 ? 3 : 0;
}
function newGame() {
  plats = MAPS[opt.map].p.map(p => ({ x0: p[0], x1: p[1], y: p[2], thin: !!p[3] }));

  const others = [0, 1, 2, 3, 4, 5, 6, 7, 8].filter(c => !used.includes(c)).sort(() => Math.random() - .5);
  fighters.push(mkF(opt.ch, 0, false, 0));
  if (opt.p2) fighters.push(mkF(opt.p2ch, 1, false, coop ? 0 : 1));

  fighters.forEach((f, i) => { spawnFighter(f, i); if (opt.thuk && f.ch === CH.VEX && !f.cpu) f.winzling = true; });
  state = 'game'; audio(); startMusic(); sfx.ok();

function mkF(ch, slot, cpu, team) { return { ch, slot, cpu, x: 0, y: 0, face: 1, in: 0, prevIn: 0, anim: 0, moveT: 0, hitMask: 0, invuln: 0, respawnT: 0, dmg: 0, stocks: opt.stocks, out: false, meter: 0, platform: 0, aiT: 0, aiHeld: 0, atkAgo: 99, specAgo: 99, team, echoTarget: 0, winzling: false }; }

function applyHit(t, ai, fromX, dmg, kb, gr, angle, melee, domainTick) {
  const sign = t.x >= fromX ? 1 : -1, cx = t.x, cy = t.y - BODY_H / 2, a = ai >= 0 ? fighters[ai] : null, ti = fighters.indexOf(t);
  if (t.ch === CH.KAITO && dom.type && (dom.owner === ti || (dom.clash && dom.owner2 === ti))) { addParticle(cx, cy, 0, 0, 8, '#78c8ff', 2); return; }

  if (t.shield) {

    for (let i = 0; i < 4; i++) addParticle(cx - sign * 10, cy, -sign * 1.5, rnd(-1, 1), 8, '#96e6ff');
    if (t.shieldHP <= 0) { t.shield = false; t.dizzy = 70; t.shieldHP = 0; addText(cx, cy - 20, 'HUCH!', '#96e6ff'); }
    return;
  }
  let d = dmg, k = kb, bf = false;
  if (melee && a && (a.ch === CH.TARO || a.ch === CH.BRUNO)) {
    bf = a.nextBF || a.bfCharges > 0 || (a.cpu && Math.random() * 100 < 6 + AILV[opt.level] * 6) || (a.ch === CH.TARO && a.taroT > 0 && Math.random() < .4);
    if (a.bfCharges > 0 && !a.nextBF) a.bfCharges--; a.nextBF = false;
    if (a.ch === CH.BRUNO && a.move === M.POWERPUNCH && Math.random() < .2) bf = true;
  }
  if (bf) { d *= 2.5; k *= 1.6; }
  if (a && !domainTick) {
    if (dom.type && dom.owner === ai && (dom.type === 'POWER' || dom.type === 'BOOM' || dom.type === 'SWAP')) d *= 1.3;
    if (a.ch === CH.REX && a.rexT > 0) d *= 1.25;
  }
  t.dmg = Math.min(999, t.dmg + d);
  if (a) {
    if (!domainTick) a.meter = Math.min(100, a.meter + d * 1.7);
    a.comboHits = a.comboTimer > 0 ? a.comboHits + 1 : 1; a.comboTimer = 40;
    if (a.comboHits >= 3) addText(a.x, a.y - BODY_H - 26, Math.min(a.comboHits, 10) + (a.comboHits >= 10 ? '+' : '') + ' HITS!', '#44e0ff');
    if ((a.ch === CH.TARO || a.ch === CH.BRUNO) && !bf) a.bfCue = 8;
  }
  const force = (k + t.dmg * gr) / CHARS[t.ch].weight, ang = angle * Math.PI / 180;

  t.ground = false; t.move = 0; t.comboQ = false; t.dizzy = 0;
