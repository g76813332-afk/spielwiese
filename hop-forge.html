    $('m1').onclick = () => { const v = $('cd').value.trim(), m = v.indexOf('#L='), code = m >= 0 ? v.slice(m + 3) : v; try { const L = decLevel(code); closeModal(); levelIntro(L, () => startPlay(L, 'shared')); } catch (e) { toast('Das ist kein gültiger Level-Link'); } }; $('m2').onclick = closeModal; });
}

// ---------- Oberfläche ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function setScreen(s) { screen = s; for (const id of ['title', 'editor', 'play']) $(id).classList.toggle('on', (id === 'title' && s === 'title') || (id === 'editor' && s === 'edit') || (id === 'play' && s === 'play')); $('touch').classList.toggle('on', s === 'play' && isTouch); if (s === 'edit') { setTimeout(() => { fitEditor(); }, 30); } }
let toastT = 0; function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, 2200); }
function modal(html, mount) { $('box').innerHTML = html; $('modal').classList.add('on'); if (mount) mount(); if (G) inputsOff(); }
function closeModal() { $('modal').classList.remove('on'); }
function inputsOff() { for (const k of ['l', 'r', 'j', 'run', 'u', 'd', 'a']) inp[k] = false; }
$('bBuild').onclick = () => { SFX.click(); initAudioOnce(); const all = loadAll(); if (all.length) listDialogBuild(); else openEditor(blankLevel(100)); };
function listDialogBuild() { modal(`<h2>Bauen</h2><div class="col"><button class="btn g big" id="m1">Neuer Level</button><button class="btn y" id="m2">Meine Level</button><button class="btn p" id="m3">Aus Beispiel</button><button class="btn p" id="m5">Überrasch mich (Zufalls-Level)</button><button class="btn gr" id="m4">Zurück</button></div>`, () => { $('m1').onclick = () => { closeModal(); openEditor(blankLevel(100)); }; $('m2').onclick = () => { closeModal(); listDialog('mine'); }; $('m3').onclick = () => { closeModal(); listDialog('ex', true); }; $('m5').onclick = () => { closeModal(); openEditor(genLevel((Math.random() * 1e9) | 0)); }; $('m4').onclick = closeModal; }); }
$('bPlay').onclick = () => { SFX.click(); initAudioOnce(); listDialog('ex'); };
$('bCode').onclick = () => { SFX.click(); codeDialog(); };
$('bMute').onclick = () => { muted = !muted; $('bMute').textContent = muted ? 'Ton aus' : 'Ton an'; try { localStorage.setItem('hb_mute', muted ? '1' : '0'); } catch (e) {} };
try { muted = localStorage.getItem('hb_mute') === '1'; $('bMute').textContent = muted ? 'Ton aus' : 'Ton an'; } catch (e) {}
try { DARK = localStorage.getItem('hb_dark') === '1'; } catch (e) {}
function applyDark() { document.body.classList.toggle('dark', DARK); $('bDark').textContent = 'Dark Mode: ' + (DARK ? 'an' : 'aus'); try { localStorage.setItem('hb_dark', DARK ? '1' : '0'); } catch (e) {} }
$('bDark').onclick = () => { DARK = !DARK; applyDark(); SFX.click(); }; applyDark();
const SKINS = [['Sonne', '#f6d2a8', '#2fb8a8', '#ff4a4a', '#5a3320'], ['Schnee', '#fbe6d2', '#7a6cff', '#ffd23a', '#e8e8f0'], ['Dunkel', '#8a5a3a', '#ff7ac8', '#4af0ff', '#1d1428'], ['Wald', '#e8b890', '#5a9a4a', '#ffb23a', '#c0462a'], ['Nacht', '#f0c8a0', '#3a3560', '#ff4a6a', '#3a2a6a']];
try { const q = JSON.parse(localStorage.getItem('hb_skin') || 'null'); if (q && /^#[0-9a-f]{6}$/i.test(q.f) && /^#[0-9a-f]{6}$/i.test(q.b) && /^#[0-9a-f]{6}$/i.test(q.c) && /^#[0-9a-f]{6}$/i.test(q.h)) SKIN = { f: q.f, b: q.b, c: q.c, h: q.h }; } catch (e) {}
function skinDialog() {
  modal(`<h2>Held gestalten</h2><canvas id="skC" width="200" height="150" style="position:static;display:block;margin:0 auto 10px;background:linear-gradient(#bfe9ff,#e8f8ff);border:3px solid #1d1428;border-radius:12px"></canvas><div class="row" id="skP" style="margin:0 0 8px">${SKINS.map((q, i) => `<button class="btn gr" data-i="${i}" style="padding:7px 12px;font-size:13px">${q[0]}</button>`).join('')}</div>
    <div class="row" style="margin:0 0 8px;align-items:center"><label class="lab" style="margin:0">Haut <input type="color" id="skF" value="${SKIN.f}" style="width:56px;height:38px;padding:0"></label><label class="lab" style="margin:0">Kleidung <input type="color" id="skB" value="${SKIN.b}" style="width:56px;height:38px;padding:0"></label><label class="lab" style="margin:0">Schal <input type="color" id="skS" value="${SKIN.c}" style="width:56px;height:38px;padding:0"></label><label class="lab" style="margin:0">Haare <input type="color" id="skH" value="${SKIN.h}" style="width:56px;height:38px;padding:0"></label></div><div class="row"><button class="btn g" id="skOk">Fertig</button></div>`, () => {
    const cx = $('skC').getContext('2d'); let tm = setInterval(() => { if (!$('skC')) { clearInterval(tm); return; } const t = performance.now() / 1000; cx.clearRect(0, 0, 200, 150); cx.save(); cx.translate(100, 130); cx.scale(3, 3); drawHero(cx, { x: -11, y: -28, w: 22, h: 28, vx: 0, vy: 0, gr: true, face: 1, ph: 0, sq: 0 }, t); cx.restore(); }, 60);
    const save = () => { SKIN = { f: $('skF').value, b: $('skB').value, c: $('skS').value, h: $('skH').value }; try { localStorage.setItem('hb_skin', JSON.stringify(SKIN)); } catch (e) {} };
    for (const b of $('skP').children) b.onclick = () => { const q = SKINS[+b.dataset.i]; $('skF').value = q[1]; $('skB').value = q[2]; $('skS').value = q[3]; $('skH').value = q[4]; save(); SFX.click(); };
    for (const id of ['skF', 'skB', 'skS', 'skH']) $(id).oninput = save; $('skOk').onclick = () => { clearInterval(tm); closeModal(); }; });
}
$('bSkin').onclick = () => { SFX.click(); skinDialog(); };
function updName() { let nm = ''; try { nm = localStorage.getItem('hb_name') || ''; } catch (e) {} $('bName').textContent = nm ? 'Name: ' + nm : 'Name'; }
function nameDialog(first) { let nm = ''; try { nm = localStorage.getItem('hb_name') || ''; } catch (e) {}
  modal(`<h2>${first ? 'Willkommen! Wie heißt du?' : 'Dein Name'}</h2><p style="text-align:center">Mit diesem Namen stehst du in den Bestenlisten.</p><input id="nmI" maxlength="12" placeholder="Name" value="${esc(nm)}"><div class="row"><button class="btn g" id="nmOk">Los!</button></div>`, () => {
    setTimeout(() => { try { $('nmI').focus(); } catch (e) {} }, 60); const ok = () => { const v = ($('nmI').value || '').trim().slice(0, 12); if (!v) { toast('Gib einen Namen ein'); return; } if (!textOk(v)) return; try { localStorage.setItem('hb_name', v); } catch (e) {} updName(); closeModal(); };
    $('nmOk').onclick = ok; $('nmI').onkeydown = e => { if (e.key === 'Enter') ok(); }; }); }
function fxDialog(back) {
  const sv = () => { try { localStorage.setItem('hb_fx', JSON.stringify(FX)); } catch (e) {} };
  modal(`<h2>Effekte & Ton</h2><div class="col"><label class="lab">Lautstärke: <b id="fvv">${FX.vol}%</b><input id="fv" type="range" min="0" max="100" step="5" value="${FX.vol}" style="padding:0"></label><button class="btn gr" id="fb">Sprechblasen (BAM!, KRACH! …): ${FX.bub ? 'an' : 'aus'}</button><button class="btn gr" id="fs">Bildschirmwackeln: ${FX.shk ? 'an' : 'aus'}</button><p style="text-align:center;font-size:13px;margin:0">Alles aus = ruhiges Spiel. Die Einstellungen gelten für dich auf diesem Gerät.</p></div><div class="row"><button class="btn g" id="fo">Fertig</button></div>`, () => {
    $('fv').oninput = () => { FX.vol = +$('fv').value; $('fvv').textContent = FX.vol + '%'; sv(); }; $('fv').onchange = () => SFX.coin();
    $('fb').onclick = () => { FX.bub = FX.bub ? 0 : 1; $('fb').textContent = 'Sprechblasen (BAM!, KRACH! …): ' + (FX.bub ? 'an' : 'aus'); sv(); }; $('fs').onclick = () => { FX.shk = FX.shk ? 0 : 1; $('fs').textContent = 'Bildschirmwackeln: ' + (FX.shk ? 'an' : 'aus'); sv(); };
    $('fo').onclick = () => { closeModal(); if (back) back(); }; }); }
$('bName').onclick = () => { SFX.click(); nameDialog(false); }; $('bCamp').onclick = () => { SFX.click(); initAudioOnce(); campaignDialog(); }; $('bDaily').onclick = () => { SFX.click(); initAudioOnce(); levelIntro(dailyLevel(), () => startPlay(dailyLevel(), 'play')); }; $('bAch').onclick = () => { SFX.click(); achDialog(); }; $('bFx').onclick = () => { SFX.click(); fxDialog(); }; updName();
function settingsMenu() {
  const mk = (id, t) => `<button class="btn gr" id="${id}">${t}</button>`;
  modal(`<h2>Einstellungen</h2><div class="col">${mk('sMu', $('bMute').textContent)}${mk('sDk', $('bDark').textContent)}${mk('sFx', 'Effekte & Lautstärke')}${mk('sSk', 'Held gestalten')}${mk('sNm', $('bName').textContent)}</div><div class="row"><button class="btn g" id="m1">Fertig</button></div>`, () => {
    $('sMu').onclick = () => { $('bMute').click(); $('sMu').textContent = $('bMute').textContent; }; $('sDk').onclick = () => { $('bDark').click(); $('sDk').textContent = $('bDark').textContent; };
    $('sFx').onclick = () => fxDialog(settingsMenu); $('sSk').onclick = () => skinDialog(); $('sNm').onclick = () => nameDialog(false); $('m1').onclick = closeModal; }); }
{ const row = $('bCode').parentNode, sb = document.createElement('button'); sb.className = 'btn gr'; sb.id = 'bSet'; sb.textContent = 'Einstellungen'; row.insertBefore(sb, $('bMute')); for (const id of ['bMute', 'bDark', 'bSkin', 'bName', 'bFx']) $(id).style.display = 'none'; sb.onclick = () => { SFX.click(); settingsMenu(); }; }
try { if (!localStorage.getItem('hb_name')) setTimeout(() => nameDialog(true), 500); } catch (e) {}
$('pause').onclick = pauseGame;
$('modal').addEventListener('pointerdown', e => { if (e.target === $('modal') && !(G && G.paused) && !(G && G.state === 'win')) closeModal(); });

// ---------- Hauptschleife ----------
let last = performance.now(), acc = 0, tt = 0;
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; tt += dt; acc += dt; while (acc >= 1 / 60) { updGame(1 / 60); acc -= 1 / 60; }
  if (screen === 'play' && G) renderGame(tt); else if (screen === 'edit' && E) renderEditor(tt); else { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawBg(ctx, VW, VH, tt * 40, DARK ? 1 : 0, tt); drawTitleScene(tt); }
  requestAnimationFrame(loop);
}
function drawTitleScene(t) { const sc = VH / 300; ctx.save(); ctx.scale(1, 1); const gy = VH * .86; ctx.fillStyle = TH[0].dirt; ctx.fillRect(0, gy, VW, VH - gy); ctx.fillStyle = TH[0].grass; ctx.fillRect(0, gy, VW, 14); ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(VW, gy); ctx.stroke();
  const x = ((t * 120) % (VW + 200)) - 100, hop = Math.abs(Math.sin(t * 6)) * 40 * sc * .3; ctx.save(); ctx.translate(x, gy - hop); ctx.scale(sc * .8, sc * .8); drawHero(ctx, { x: -11, y: -28, w: 22, h: 28, vx: 200, gr: hop < 2, face: 1, ph: t * 14, big: 0, sq: 0 }, t); ctx.restore(); ctx.restore(); }
// Link-Level direkt starten
function openShared() { const h = location.hash; if (h.startsWith('#L=')) { try { const L = decLevel(h.slice(3)); levelIntro(L, () => startPlay(L, 'shared')); } catch (e) { toast('Level-Link ungültig'); } } }
addEventListener('hashchange', openShared);
requestAnimationFrame(loop); openShared();
window.__hb = { badText, genLevel, dailyLevel, diffOf, packList, getSt, get G() { return G; }, get E() { return E; }, T, inp, EXAMPLES, encLevel, decLevel, startPlay, openEditor, newLevel, updGame, renderGame, isProven, levelHash, tileAt, get screen() { return screen; } };
})();
</script>
