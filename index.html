<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spielwiese</title>
<style>
  :root{--bg:#121212;--line:#2a2a2a;--txt:#eee;--mut:#8d8d8d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
  header{display:flex;align-items:baseline;gap:16px;padding:22px 28px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px}
  header span{color:var(--mut);font-size:14px}
  header .dc{margin-left:auto;background:#5865f2;color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:8px 16px;border-radius:8px}
  header .dc:hover{background:#4752c4}
  main{max-width:1100px;margin:0 auto;padding:28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  a.card{display:block;color:inherit;text-decoration:none}
  .thumb{position:relative;aspect-ratio:16/10;border-radius:6px;overflow:hidden;display:flex;align-items:flex-end;padding:14px;transition:transform .12s}
  a.card:hover .thumb,a.card:focus-visible .thumb{transform:translateY(-3px)}
  a.card:focus-visible{outline:none}
  .thumb b{font-size:clamp(26px,4vw,34px);line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
  .meta{display:flex;justify-content:space-between;padding:10px 2px 0;font-size:14px}
  .meta em{font-style:normal;color:var(--mut)}
  .meta strong{font-weight:600}
  .thumb{background-size:cover;background-color:#222}
  .t-sumpf{background-image:url(thumb-sumpfgans.jpg);background-position:center}
  .t-secret{background:linear-gradient(160deg,#1a1050,#8a2a60)}
  .card[hidden]{display:none}
  .t-retro{background-image:url(thumb-retro-city4.jpg);background-position:right center}
  .t-hb{background-image:url(thumb-huepf-baumeister.jpg);background-position:center}
  @media(max-width:600px){header{padding:16px 18px}main{padding:18px}.grid{gap:16px}}
</style>
</head>
<body>
<header><h1>Spielwiese</h1><span>HTML5-Spiele für Browser und Tablet</span><a class="dc" href="https://discord.gg/vQ5JXKqbFp" target="_blank" rel="noopener">Discord</a></header>
<main>
  <div class="grid">
    <a class="card" href="sumpfgans.html">
      <div class="thumb t-sumpf"></div>
      <div class="meta"><strong>Sumpfgans</strong><em>Shooter</em></div>
    </a>
    <a class="card" href="retro-city4.html">
      <div class="thumb t-retro"></div>
      <div class="meta"><strong>Retro City 4</strong><em>Action</em></div>
    </a>
    <a class="card" href="huepf-baumeister.html">
      <div class="thumb t-hb"></div>
      <div class="meta"><strong>Hüpf-Baumeister</strong><em>Hüpfen &amp; Bauen</em></div>
    </a>
    <a class="card secret" id="secret" href="kampfgeist.html" hidden>
      <div class="thumb t-secret"></div>
      <div class="meta"><strong>Kampfgeist</strong><em>Kampf</em></div>
    </a>
  </div>
</main>
<script>
// Geheimes Spiel: dreimal schnell auf "Spielwiese" tippen, dann erscheint die Kachel
(function () {
  var card = document.getElementById('secret'), h = document.querySelector('header h1'), taps = [];
  try { if (localStorage.getItem('sw_secret') === '1') card.hidden = false; } catch (e) {}
  h.style.cursor = 'default'; h.style.userSelect = 'none'; h.style.webkitUserSelect = 'none';
  h.addEventListener('click', function () {
    var now = Date.now(); taps = taps.filter(function (t) { return now - t < 1500; }); taps.push(now);
    if (taps.length >= 3) {
      taps = []; card.hidden = !card.hidden;
      try { localStorage.setItem('sw_secret', card.hidden ? '0' : '1'); } catch (e) {}
    }
  });
})();
</script>
</body>
</html>
